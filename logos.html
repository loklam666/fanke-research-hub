<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公司 Logo 素材库 · 泛柯实习/求职板块筹备</title>
<link rel="icon" href="data:image/png;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciLz4=">
<style>
  :root{
    --orange:#F4532B; --orange-dark:#D8431F; --orange-soft:#FEEFE9;
    --ink:#1D1D1F; --ink-2:#4B4B50; --ink-3:#8A8A90;
    --bg:#FAF8F6; --card:#FFFFFF; --line:#ECE8E4;
    --radius:16px; --shadow:0 1px 2px rgba(29,29,31,.05),0 8px 24px rgba(29,29,31,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .header{background:linear-gradient(120deg,#FFF7F3 0%,#FDEDE5 55%,#FBE3D8 100%);border-bottom:1px solid var(--line)}
  .header-inner{max-width:1200px;margin:0 auto;padding:36px 24px 30px}
  .back{font-size:13px;color:var(--ink-3);text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
  .back:hover{color:var(--orange)}
  h1{font-size:26px;font-weight:900}
  h1 span{color:var(--orange)}
  .sub{margin-top:6px;font-size:13.5px;color:var(--ink-2);max-width:720px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:12.5px;color:var(--ink-2);box-shadow:var(--shadow)}
  .stat b{color:var(--orange)}
  main{max-width:1200px;margin:0 auto;padding:28px 24px 60px}
  section{margin-bottom:34px}
  section h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:14px}
  section h2::before{content:"";width:4px;height:18px;background:var(--orange);border-radius:2px}
  section h2 .n{font-size:12px;font-weight:600;color:var(--ink-3);background:#F3F1EF;border-radius:999px;padding:2px 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;transition:.18s;box-shadow:var(--shadow)}
  .card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(29,29,31,.06),0 16px 40px rgba(29,29,31,.12);border-color:#F5C9B8}
  .logo-box{height:52px;width:100%;display:flex;align-items:center;justify-content:center}
  .logo-box img{max-height:48px;max-width:110px;object-fit:contain}
  .monogram{height:44px;width:44px;border-radius:12px;background:linear-gradient(135deg,var(--orange),#FF8A5C);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
  .nm{font-size:13px;font-weight:700;text-align:center;line-height:1.3}
  .en{font-size:11px;color:var(--ink-3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  footer{border-top:1px solid var(--line);background:var(--card)}
  .footer-inner{max-width:1200px;margin:0 auto;padding:22px 24px;font-size:12.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .footer-inner code{background:#F3F1EF;border-radius:6px;padding:2px 8px;font-size:12px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <a class="back" href="index.html">← 返回科研项目库</a>
    <h1>公司 Logo 素材库<span> · 实习/求职板块筹备</span></h1>
    <p class="sub">为后续「实习直通 / 求职资源」板块预采集的公司标识，覆盖互联网、金融、咨询、四大、快消、医药等校招热门行业。Logo 版权归各公司所有，仅用于站内资源识别展示。</p>
    <div class="stats" id="stats"></div>
  </div>
</div>
<main id="main"></main>
<footer>
  <div class="footer-inner">
    <div>© 泛柯教育 Fanke Education</div>
    <div>新增公司：编辑 <code>scripts/companies.json</code> → 运行 <code>node scripts/fetch-logos.mjs</code></div>
  </div>
</footer>
<script src="assets/logos.js"></script>
<script>
(function(){
  const L = window.__LOGOS || [];
  const $ = id => document.getElementById(id);
  const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // 行业分组（保持固定顺序）
  const order = ['互联网','人工智能','游戏','硬件与通信','新能源与汽车','国际科技','金融科技','金融','咨询','快消与零售','医药与健康'];
  const groups = {};
  for(const c of L){ (groups[c.industry] = groups[c.industry] || []).push(c); }
  // 统计
  const total = L.length, withLogo = L.filter(c=>c.file).length;
  $('stats').innerHTML = `<span class="stat"><b>${total}</b> 家公司</span>` + order.filter(g=>groups[g]).map(g=>`<span class="stat">${esc(g)} <b>${groups[g].length}</b></span>`).join('') + `<span class="stat">已采集 logo <b>${withLogo}</b></span>`;
  // 渲染
  $('main').innerHTML = order.filter(g=>groups[g]).map(g=>`
    <section>
      <h2>${esc(g)}<span class="n">${groups[g].length}</span></h2>
      <div class="grid">
        ${groups[g].map(c=>`
          <div class="card" title="${esc(c.domain)}">
            <div class="logo-box">
              ${c.file
                ? `<img src="${esc(c.file)}" alt="${esc(c.nameZh)}" loading="lazy" referrerpolicy="no-referrer">`
                : `<div class="monogram">${esc((c.nameZh||c.name).slice(0,2))}</div>`}
            </div>
            <div class="nm">${esc(c.nameZh)}</div>
            <div class="en">${esc(c.name)}</div>
          </div>`).join('')}
      </div>
    </section>`).join('');
})();
</script>
</body>
</html>
